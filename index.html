<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div id="clacBody">
        <div id="calcScreen"></div>

        <div id="buttons">

            <div id="row1"><!-- clear and / -->
                <button id="clear"></button>
                <button id="divide"></button>

            </div> 

            <div id="row2"><!-- 789x -->
                <button id="7"></button>
                <button id="8"></button>
                <button id="9"></button>
                <button id="multiply"></button>


            </div> 

            <div id="row3"><!-- 456- -->
                <button id="4"></button>
                <button id="5"></button>
                <button id="6"></button>
                <button id="minus"></button>

            </div> 

            <div id="row4"> <!-- 123+ -->
                <button id="1"></button>
                <button id="2"></button>
                <button id="3"></button>
                <button id="plus"></button>


            </div>

            <div id="row5"> <!-- 0.= -->
                <button id="0"></button>
                <button id="dot"></button>
                <button id="equal"></button>


            </div>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
